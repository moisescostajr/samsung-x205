name: Build GTA8 LTE Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev pkg-config \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-pil cpio lz4 gzip tar wget rsync

      - name: Build Kernel and Boot Pack
        run: |
          chmod +x tools/build-kernel-ci.sh
          ./tools/build-kernel-ci.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta8-boot-pack
          path: boot-pack/
