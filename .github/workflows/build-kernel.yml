name: Build GTA8 LTE Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: gta8-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev pkg-config \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            python3 python3-pil cpio lz4 gzip tar wget rsync

      - name: Build Kernel and Boot Pack
        run: |
          chmod +x tools/build-kernel-ci.sh
          ./tools/build-kernel-ci.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta8-boot-pack
          path: boot-pack/
          retention-days: 7

  rootfs:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Download kernel boot pack
        uses: actions/download-artifact@v4
        with:
          name: gta8-boot-pack
          path: boot-pack

      - name: Install rootfs dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap qemu-user-static binfmt-support debian-archive-keyring arch-test \
            e2fsprogs dosfstools parted gdisk xz-utils rsync ca-certificates

      - name: Enable arm64 binfmt
        run: |
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            sudo update-binfmts --enable qemu-aarch64
          fi
          ls -l /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Fetch bookworm archive keyring
        run: |
          curl -fsSL -o /tmp/dak.deb \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3+deb12u2_all.deb
          dpkg-deb -x /tmp/dak.deb /tmp/dak
          ls -l /tmp/dak/usr/share/keyrings/debian-archive-keyring.gpg

      - name: Build Debian + Phosh image
        run: |
          chmod +x tools/build-rootfs.sh tools/rootfs-configure.sh tools/gta8-bringup.sh
          sudo -E env GTA8_KEYRING=/tmp/dak/usr/share/keyrings/debian-archive-keyring.gpg \
            ./tools/build-rootfs.sh

      - name: Assemble boot pack tarball
        run: |
          cd boot-pack
          # Optional helpers must not make the whole pack fall back: include
          # whatever was actually built.
          files=(Image-v57 ramdisk.cpio.gz modules)
          for f in propstub.so extract.so drmstep-fb2 splash.bgra; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          tar -czf ../rootfs/release/gta8-boot-pack.tar.gz "${files[@]}"
          cd ..
          ( cd rootfs/release && sha256sum gta8-boot-pack.tar.gz >> SHA256SUMS )
          ls -lh rootfs/release

      - name: Verify release files
        run: |
          cat rootfs/release/manifest.txt
          ( cd rootfs/release && sha256sum -c SHA256SUMS )
          parted -s rootfs/disk.raw unit MiB print

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=image-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                [ -n "$name" ] && gh release delete-asset "$TAG" "$name" -y
              done
          else
            gh release create "$TAG" \
              --title "GTA8 Debian 12 + Phosh image" \
              --notes "Rolling image and boot pack for the Samsung Galaxy Tab A8 LTE (SM-X205). Built from ${GITHUB_SHA}."
          fi
          gh release upload "$TAG" rootfs/release/* --clobber

      - name: Upload release files as workflow artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gta8-rootfs-release
          path: rootfs/release/
          retention-days: 14
