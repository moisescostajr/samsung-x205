# PC-like session for gta8wifi. Wayfire is a wlroots compositor like phoc,
# so it can reuse the Mali r13 + seatd path. Do not run this next to phoc.
[core]
plugins = \
  animate \
  autostart \
  command \
  decoration \
  expo \
  extra-gestures \
  fast-switcher \
  grid \
  move \
  place \
  resize \
  scale \
  switcher \
  vswitch \
  window-rules \
  wm-actions
close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 2
vheight = 1
preferred_decoration_mode = server
xwayland = true

[input-device:himax-touchscreen]
output = DSI-1

[input-device:gpio-keys]
output = DSI-1

[output:DSI-1]
transform = 90
scale = 1.000000

[decoration]
font = Sans 12
title_height = 36
border_size = 4

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[autostart]
autostart_wf_shell = false

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = xfce4-terminal
binding_launcher = <super> KEY_D | <alt> KEY_F2
command_launcher = wofi --show drun --insensitive -W 70% -H 50%
binding_files = <super> KEY_E
command_files = thunar
binding_phosh = <super> <shift> KEY_P
command_phosh = /root/start-phosh.sh

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_ESC

[expo]
toggle = <super>

[scale]
toggle = <super> KEY_TAB

[wm-actions]
toggle_fullscreen = <super> KEY_F
