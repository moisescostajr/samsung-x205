# Software-only playback on gta8wifi.
#
# phoc runs the pixman (software) renderer, so it can only composite wl_shm
# buffers. Anything EGL/GL based (VLC's gl/gles2 vout) shows a black window.
# wlshm is mpv's shared-memory Wayland output, which is what works here.
#
# There is no GPU driver and no video decode acceleration: Mali uses the
# Android kbase driver, not Panfrost, and the Unisoc VPU has no Linux driver.
# Everything below is about keeping the CPU cost down.
vo=wlshm
ao=pulse
hwdec=no
profile=fast
scale=bilinear
dscale=bilinear
cscale=bilinear
video-sync=audio
framedrop=vo
fullscreen=yes
osc=yes
